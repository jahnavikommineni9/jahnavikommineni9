<svg
width="900"
height="300"
viewBox="0 0 900 300"
xmlns="http://www.w3.org/2000/svg">

<!-- ============================== -->
<!-- DEFINITIONS -->
<!-- ============================== -->

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#070707"/>
<stop offset="100%" stop-color="#120000"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<pattern
id="grid"
width="60"
height="60"
patternUnits="userSpaceOnUse">

<path
d="M60 0H0V60"
fill="none"
stroke="#440011"
stroke-width="1"/>

</pattern>

</defs>

<!-- Background -->

<rect
width="900"
height="300"
fill="url(#bg)"/>

<rect
width="900"
height="300"
fill="url(#grid)"
opacity="0.45"/>

<!-- Border -->

<rect
x="12"
y="12"
width="876"
height="276"
rx="20"
fill="none"
stroke="#ff0033"
stroke-width="3"
filter="url(#glow)"/>

<!-- Corner Dots -->

<circle cx="28" cy="28" r="6" fill="#ff0033"/>
<circle cx="872" cy="28" r="6" fill="#ff0033"/>
<circle cx="28" cy="272" r="6" fill="#ff0033"/>
<circle cx="872" cy="272" r="6" fill="#ff0033"/>

<!-- Title -->

<rect
x="250"
y="30"
width="400"
height="54"
rx="10"
fill="#111111"
stroke="#ff0033"/>

<circle
cx="275"
cy="57"
r="8"
fill="#00ff66">

<animate
attributeName="opacity"
values="1;0.2;1"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

<text
x="450"
y="65"
text-anchor="middle"
fill="white"
font-size="24"
font-family="Georgia"
font-weight="bold">

📬 CONTACT TERMINAL

</text>
