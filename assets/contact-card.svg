<!-- ================================= -->

<rect
x="-120"
y="0"
width="90"
height="300"
fill="white"
opacity="0.04"
transform="skewX(-20)">

<animate
attributeName="x"
values="-120;980"
dur="5s"
repeatCount="indefinite"/>

</rect>

