<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050505"/>
<stop offset="50%" stop-color="#120000"/>
<stop offset="100%" stop-color="#050505"/>
</linearGradient>

<linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff1a3d"/>
<stop offset="100%" stop-color="#7a0015"/>
</linearGradient>

<radialGradient id="moon">
<stop offset="0%" stop-color="#ff4d6d"/>
<stop offset="100%" stop-color="#5c0010"/>
</radialGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<!-- Background -->

<rect width="1200" height="320" fill="url(#bg)"/>

<!-- Outer Border -->

<rect
x="8"
y="8"
width="1184"
height="304"
rx="18"
fill="none"
stroke="url(#border)"
stroke-width="3"
filter="url(#glow)">

<animate
attributeName="stroke-opacity"
values="0.4;1;0.4"
dur="4s"
repeatCount="indefinite"/>

</rect>

<!-- Red Moon -->

<circle
cx="120"
cy="95"
r="70"
fill="url(#moon)"
filter="url(#glow)">

<animate
attributeName="r"
values="68;72;68"
dur="5s"
repeatCount="indefinite"/>

</circle>

<!-- Japanese Text -->

<text
x="40"
y="260"
fill="#ff304f"
font-size="46"
font-family="serif"
writing-mode="tb">

影
炎
紅

</text>

<!-- Neon Lines -->

<line x1="0" y1="40" x2="1200" y2="40"
stroke="#220000"
stroke-width="2"/>

<line x1="0" y1="280" x2="1200" y2="280"
stroke="#220000"
stroke-width="2"/>

<!-- Animated Scan Line -->

<rect
x="0"
y="0"
width="1200"
height="2"
fill="#ff3355"
opacity="0.6">

<animate
attributeName="y"
values="0;320;0"
dur="6s"
repeatCount="indefinite"/>

</rect>

<!-- Floating Particles -->

<circle cx="980" cy="60" r="3" fill="#ff3355">

<animate
attributeName="cy"
values="60;250;60"
dur="5s"
repeatCount="indefinite"/>

</circle>

<circle cx="1080" cy="210" r="4" fill="#ff3355">

<animate
attributeName="cy"
values="210;70;210"
dur="6s"
repeatCount="indefinite"/>

</circle>

<circle cx="1130" cy="120" r="5" fill="#ff3355">

<animate
attributeName="cy"
values="120;260;120"
dur="4s"
repeatCount="indefinite"/>

</circle>
<!-- ================= HERO TEXT ================= -->

<text
x="430"
y="75"
fill="#ffffff"
font-size="28"
font-family="Segoe UI"
font-weight="bold">

Hi, I'm

</text>

<text
x="420"
y="150"
fill="#ff1a3d"
font-size="86"
font-family="Impact"
font-weight="900"
filter="url(#glow)">

JAHNAVI

<animate
attributeName="opacity"
values="0.85;1;0.85"
dur="2s"
repeatCount="indefinite"/>

</text>

<text
x="430"
y="205"
fill="#ffffff"
font-size="46"
font-family="Arial"
font-style="italic">

KOMMINENI

</text>

<!-- ================= SUBTITLE ================= -->

<rect
x="410"
y="230"
width="410"
height="38"
rx="8"
fill="#111111"
stroke="#ff1a3d"
stroke-width="1.5"/>

<text
x="430"
y="255"
fill="white"
font-size="18"
font-family="Arial">

CYBER SECURITY • AI • IoT • JAPANESE LEARNER

</text>

<!-- ================= TOP LEFT CODE ================= -->

<text
x="260"
y="38"
fill="#ff5b5b"
font-size="15"
font-family="Consolas">

&gt;&gt; while(alive){

</text>

<text
x="280"
y="60"
fill="#ffffff"
font-size="15"
font-family="Consolas">

learn();

</text>

<text
x="280"
y="82"
fill="#ffffff"
font-size="15"
font-family="Consolas">

build();

</text>

<text
x="280"
y="104"
fill="#ffffff"
font-size="15"
font-family="Consolas">

secure();

</text>

<text
x="260"
y="126"
fill="#ff5b5b"
font-size="15"
font-family="Consolas">

}

</text>

<!-- ================= DECORATIVE CORNERS ================= -->

<path
d="M25 25 L70 25 M25 25 L25 70"
stroke="#ff1a3d"
stroke-width="3"
fill="none"/>

<path
d="M1175 25 L1130 25 M1175 25 L1175 70"
stroke="#ff1a3d"
stroke-width="3"
fill="none"/>

<path
d="M25 295 L70 295 M25 295 L25 250"
stroke="#ff1a3d"
stroke-width="3"
fill="none"/>

<path
d="M1175 295 L1130 295 M1175 295 L1175 250"
stroke="#ff1a3d"
stroke-width="3"
fill="none"/>

<!-- ================= GLOWING DOTS ================= -->

<circle cx="1010" cy="40" r="2" fill="#ff1a3d">
<animate attributeName="r"
values="2;5;2"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="1040" cy="55" r="2" fill="#ff1a3d">
<animate attributeName="r"
values="2;5;2"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="35" r="2" fill="#ff1a3d">
<animate attributeName="r"
values="2;5;2"
dur="2.5s"
repeatCount="indefinite"/>
</circle>
</svg>
