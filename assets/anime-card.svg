<svg xmlns="http://www.w3.org/2000/svg"
width="350"
height="520"
viewBox="0 0 350 520">

<defs>

<!-- Background -->

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%"
stop-color="#050505"/>

<stop offset="100%"
stop-color="#170000"/>

</linearGradient>

<!-- Neon Border -->

<linearGradient id="red">

<stop offset="0%"
stop-color="#ff0033"/>

<stop offset="100%"
stop-color="#8b0000"/>

</linearGradient>

<!-- Portrait Glow -->

<radialGradient id="glow">

<stop offset="0%"
stop-color="#ff0033"
stop-opacity="0.45"/>

<stop offset="100%"
stop-color="#ff0033"
stop-opacity="0"/>

</radialGradient>

<!-- Grid Pattern -->

<pattern
id="grid"
width="20"
height="20"
patternUnits="userSpaceOnUse">

<path
d="M20 0H0V20"
fill="none"
stroke="#440011"
stroke-width="0.5"/>

</pattern>

</defs>

<!-- Background -->

<rect
width="350"
height="520"
rx="22"
fill="url(#bg)"/>

<!-- Grid -->

<rect
width="350"
height="520"
rx="22"
fill="url(#grid)"
opacity="0.45"/>

<!-- Outer Border -->

<rect
x="5"
y="5"
width="340"
height="510"
rx="20"
fill="none"
stroke="url(#red)"
stroke-width="2">

<animate
attributeName="stroke-opacity"
values="0.3;1;0.3"
dur="2.5s"
repeatCount="indefinite"/>

</rect>

<!-- Corner Decorations -->

<path
d="M25 25H55M25 25V55"

stroke="#ff0033"

stroke-width="2"/>

<path
d="M325 25H295M325 25V55"

stroke="#ff0033"

stroke-width="2"/>

<path
d="M25 495H55M25 495V465"

stroke="#ff0033"

stroke-width="2"/>

<path
d="M325 495H295M325 495V465"

stroke="#ff0033"

stroke-width="2"/>

<!-- Portrait Glow -->

<circle

cx="175"

cy="170"

r="110"

fill="url(#glow)">

<animate

attributeName="r"

values="105;118;105"

dur="4s"

repeatCount="indefinite"/>

</circle>

<!-- Portrait Frame -->

<rect

x="50"

y="45"

width="250"

height="250"

rx="22"

fill="#111111"

stroke="#ff0033"

stroke-width="2"/>

<!-- HUD Rings -->

<circle

