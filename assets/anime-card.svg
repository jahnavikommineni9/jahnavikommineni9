
<svg width="350" height="520" viewBox="0 0 350 520"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Background -->
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050505"/>
<stop offset="100%" stop-color="#150000"/>
</linearGradient>

<!-- Border -->
<linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff0033"/>
<stop offset="100%" stop-color="#990000"/>
</linearGradient>

<!-- Portrait Glow -->
<radialGradient id="portraitGlow">
<stop offset="0%" stop-color="#ff0033" stop-opacity="0.45"/>
<stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
</radialGradient>

<!-- Glow -->
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="4"/>
</filter>

</defs>

<!-- Background -->
<rect
width="350"
height="520"
rx="22"
fill="url(#bg)"/>

<!-- Neon Border -->
<rect
x="6"
y="6"
width="338"
height="508"
rx="20"
fill="none"
stroke="url(#border)"
stroke-width="2">

<animate
attributeName="stroke-opacity"
values="0.4;1;0.4"
dur="3s"
repeatCount="indefinite"/>

</rect>

<!-- Portrait Glow -->
<circle
cx="175"
cy="160"
r="105"
fill="url(#portraitGlow)">
<animate
attributeName="r"
values="100;108;100"
