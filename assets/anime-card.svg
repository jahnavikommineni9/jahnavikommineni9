cy="170"

r="92"

fill="none"

stroke="#ff0033"

stroke-width="1"

opacity="0.25">

<animateTransform

attributeName="transform"

type="rotate"

from="0 175 170"

to="360 175 170"

dur="12s"

repeatCount="indefinite"/>

</circle>

<circle

cx="175"

cy="170"

r="105"

fill="none"

stroke="#ff0033"

stroke-width="0.8"

opacity="0.15">

<animateTransform

attributeName="transform"

type="rotate"

from="360 175 170"

to="0 175 170"

dur="20s"

repeatCount="indefinite"/>

</circle>
