x="270"
y="28"
width="360"
height="52"
rx="10"
fill="#111111"
stroke="#ff0033"/>

<circle
cx="290"
cy="54"
r="8"
fill="#00ff66">

<animate
attributeName="opacity"
values="1;0.2;1"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

