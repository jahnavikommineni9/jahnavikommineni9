<svg
width="900"
height="430"
viewBox="0 0 900 430"
xmlns="http://www.w3.org/2000/svg">

<!-- ================================= -->
<!-- DEFINITIONS -->
<!-- ================================= -->

<defs>

<!-- Background -->
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">

<stop offset="0%" stop-color="#070707"/>

<stop offset="100%" stop-color="#120000"/>

</linearGradient>

<!-- Red Glow -->

<filter id="glow">

<feGaussianBlur stdDeviation="4" result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<!-- Grid -->

<pattern
id="grid"
width="60"
height="60"
patternUnits="userSpaceOnUse">

<path
d="M60 0H0V60"
fill="none"
stroke="#440011"
stroke-width="1"/>

</pattern>

</defs>

<!-- Background -->

<rect
width="900"
height="430"
fill="url(#bg)"/>

<!-- Grid -->

<rect
width="900"
height="430"
fill="url(#grid)"
opacity="0.45"/>

<!-- Border -->

<rect
x="12"
y="12"
width="876"
height="406"
rx="20"
fill="none"
stroke="#ff0033"
stroke-width="3"
filter="url(#glow)"/>

<!-- Corner Dots -->

<circle cx="25" cy="25" r="6" fill="#ff0033"/>
<circle cx="875" cy="25" r="6" fill="#ff0033"/>
<circle cx="25" cy="405" r="6" fill="#ff0033"/>
<circle cx="875" cy="405" r="6" fill="#ff0033"/>

<!-- Title Panel -->

