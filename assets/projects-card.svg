<svg
width="900"
height="620"
viewBox="0 0 900 620"
xmlns="http://www.w3.org/2000/svg">

<!-- ================================= -->
<!-- DEFINITIONS -->
<!-- ================================= -->

<defs>

<!-- Background -->
<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#070707"/>
<stop offset="100%" stop-color="#120000"/>

</linearGradient>

<!-- Border Glow -->
<filter id="glow">

<feGaussianBlur stdDeviation="4" result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

<!-- Grid -->
<pattern
id="grid"
width="60"
height="60"
patternUnits="userSpaceOnUse">

<path
d="M60 0H0V60"
fill="none"
stroke="#440011"
stroke-width="1"/>

</pattern>

</defs>

<!-- ================================= -->
<!-- BACKGROUND -->
<!-- ================================= -->

<rect
width="900"
height="620"
fill="url(#bg)"/>

<rect
width="900"
height="620"
fill="url(#grid)"
opacity="0.45"/>

<!-- Border -->

<rect
x="12"
y="12"
width="876"
height="596"
rx="20"
fill="none"
stroke="#ff0033"
stroke-width="3"
filter="url(#glow)"/>

<!-- Corner Dots -->

<circle cx="28" cy="28" r="6" fill="#ff0033"/>
<circle cx="872" cy="28" r="6" fill="#ff0033"/>
<circle cx="28" cy="592" r="6" fill="#ff0033"/>
<circle cx="872" cy="592" r="6" fill="#ff0033"/>

<!-- ================================= -->
<!-- TITLE -->
<!-- ================================= -->

<rect
x="250"
y="30"
width="400"
height="54"
rx="10"
fill="#111111"
stroke="#ff0033"/>

<circle
cx="272"
cy="57"
r="8"
fill="#00ff66">

<animate
attributeName="opacity"
values="1;0.2;1"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

<text
x="450"
y="65"
text-anchor="middle"
fill="white"
font-size="24"
font-family="Georgia"
font-weight="bold">

PROJECT DATABASE

</text>

<!-- Version -->

<text
x="805"
y="30"
fill="#666666"
font-size="13"
font-family="Consolas">

SYSTEM v3.0

</text>

<!-- Japanese -->

<text
x="60"
y="320"
fill="#770022"
font-size="42"
font-family="serif"
writing-mode="tb">

計画

</text>

