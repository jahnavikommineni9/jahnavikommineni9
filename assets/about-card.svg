dur="0.2s"
repeatCount="indefinite"/>

</line>

<!-- HUD Corners -->
<path
d="M215 85H235M215 85V105"
stroke="#ff0033"
stroke-width="2"/>

<path
d="M575 85H555M575 85V105"
stroke="#ff0033"
stroke-width="2"/>

<path
d="M215 315H235M215 315V295"
stroke="#ff0033"
stroke-width="2"/>

<path
d="M575 315H555M575 315V295"
stroke="#ff0033"
stroke-width="2"/>

