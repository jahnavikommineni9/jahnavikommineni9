BUILD • LEARN • INNOVATE • EVOLVE

</text>

<!-- Rotating JK Logo -->
<g>

<animateTransform
attributeName="transform"
type="rotate"
from="0 560 330"
to="360 560 330"
dur="20s"
repeatCount="indefinite"/>

<polygon
points="
560,316
572,323
572,337
560,344
548,337
548,323"
