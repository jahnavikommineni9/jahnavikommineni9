<!--         FINAL POLISH - PART 4             -->
<!-- ========================================= -->

<!-- Name Plate -->
<rect
x="225"
y="55"
width="335"
height="28"
rx="6"
fill="#0b0b0b"
stroke="#ff0033"
stroke-width="1">

<animate
attributeName="stroke-opacity"
values="0.4;1;0.4"
dur="2s"
repeatCount="indefinite"/>

</rect>

<text
x="392"
y="74"
text-anchor="middle"
fill="#ff3355"
font-size="18"
font-family="Orbitron"
font-weight="bold">

JAHNAVI KOMMINENI

<animate
attributeName="fill"
values="#ff3355;#ff6666;#ff3355"
dur="2s"
repeatCount="indefinite"/>

</text>

<!-- Target Lock -->
<circle
cx="120"
cy="170"
r="92"
fill="none"
stroke="#ff0033"
stroke-width="1"
stroke-dasharray="10 6"
opacity="0.35">

<animateTransform
attributeName="transform"
type="rotate"
from="360 120 170"
to="0 120 170"
dur="12s"
repeatCount="indefinite"/>

</circle>

<!-- Moving Scanner Dot -->
<circle
cx="120"
cy="78"
r="4"
fill="#ff0033">

<animateTransform
attributeName="transform"
type="rotate"
from="0 120 170"
to="360 120 170"
dur="5s"
repeatCount="indefinite"/>

</circle>

<!-- Divider -->
<line
x1="225"
y1="80"
x2="560"
y2="80"
stroke="#330000"/>

<!-- Bottom Motto -->
<text
x="300"
y="350"
text-anchor="middle"
fill="#666666"
font-size="12"
